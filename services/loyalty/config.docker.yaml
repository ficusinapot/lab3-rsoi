http:
  api_prefix: /api/v1
  address: ":8050"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  request_timeout: 5s
  shutdown_timeout: 10s
  max_body_bytes: 4096
database:
  url: postgres://program:test@reservation-db:5432/loyalties?sslmode=disable
  max_open_connections: 20
  max_idle_connections: 5
  connection_max_lifetime: 5m
  connection_max_idle_time: 1m
  connect_timeout: 5s
metrics:
  path: /metrics
  service: loyalty
  version: "1.0.0"
  latency_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
openapi:
  title: Loyalty Service
  version: "1.0.0"
  docs_path: /docs
  schema_path: /openapi
logging:
  level: info
  stdout:
    level: info
  files: []
